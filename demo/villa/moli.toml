# La villa de démonstration : une maison complète, sans aucun appareil réel.
# Chaque appareil copie la forme d'un vrai (mêmes points, même tableau de bord)
# et vit tout seul (crate moli-demo). Ouverte à tout visiteur ([server] demo).
#
#   docker compose -f demo/villa/compose.yaml up      → http://localhost:8790
#   cd demo/villa && MOLI_UI_PIN=123456 cargo run -p moli-os -- --config moli.toml serve

[server]
listen = "0.0.0.0:8790"
data_dir = "data"
worker_threads = 2
# The names the demo is reached by, besides localhost (set at deployment).
allowed_hosts = []
history_days = 7
demo_seed = "seed"
demo = true

[guard]
protected_rooms = ["Chambre de Léa", "Chambre de Hugo", "Sécurité"]

[guard.quiet_hours]
from = "22:00"
to = "07:30"
timezone = "Europe/Paris"
rooms = ["Chambre de Léa", "Chambre de Hugo"]

