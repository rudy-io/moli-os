[package]
name = "moli-zigbee"
description = "Moli OS driver for Zigbee: a native EZSP coordinator (Silicon Labs dongles), without Zigbee2MQTT or a broker."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
moli-core.workspace = true
moli-i18n.workspace = true
moli-runtime.workspace = true
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
# io-util: the EZSP client reads and writes the port.
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

# The workspace table, except `unsafe_code`: `forbid` cannot be relaxed by an
# `#[allow]`, and termios (src/transport.rs) has no safe libc binding. It is
# `deny` here, allowed on that one function; keep the rest in step with the root.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
assert_is_empty = "allow"
