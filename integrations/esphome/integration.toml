[integration]
id = "esphome"
name = "Appareil ESPHome (satellite vocal, prise, compteur P1…)"
# Any ESPHome device with the native API and an encryption key: voice
# satellites (Home Assistant Voice PE), and any other device's sensors and
# switches (a metering plug, a P1 meter reader).
brands = ["Nabu Casa", "ESPHome"]
models = ["Home Assistant Voice PE", "prise mesurée", "lecteur P1"]
transport = "tcp"
driver = "esphome"
crate = "moli-esphome"

[discovery]
# ESPHome devices announce `_esphomelib._tcp` over mDNS; the instance gives
# the address for now.
mdns = ["_esphomelib._tcp"]
ssdp = []
ports = [6053]

[needs]
secrets = ["api_key"]
vars = []
options = ["host"]

[origin]
reused = ""
author = "agent"
