[integration]
id = "homeassistant"
name = "Home Assistant (temporary migration bridge)"
brands = ["Home Assistant"]
models = ["Explicit entities"]
transport = "http"
driver = "homeassistant"
crate = "moli-homeassistant"

[discovery]
mdns = []
ssdp = []
ports = [8123]

[needs]
secrets = ["token", "token_endpoint"]
