# Meross EM06 / EM06P: 6-channel energy monitor, local signed API
# (no cloud at run time). The device key comes from the Meross account the
# monitor was set up with; store it once:
#   moli-os secrets set <instance> key        (value on standard input)
# Protocol knowledge from the community (meross_lan, merossiot); no code
# copied. Units on the wire: mA, mV, mW, Wh. Read-only.

[profile]
id = "meross-em06"
name = "Compteur d'énergie Meross EM06"
manufacturer = "Meross"
model = "EM06"
secret = "key"
identity = "all.payload.all.system.hardware.uuid"
name_from = "all.payload.all.system.hardware.type"

[[request]]
id = "all"
path = "/config"
format = "json"
every = "1h"
transport = "meross"
namespace = "Appliance.System.All"
payload = "{}"

[[request]]
id = "e"
path = "/config"
format = "json"
every = "15s"
transport = "meross"
namespace = "Appliance.Control.ElectricityX"
payload = '{"electricity": [{"channel": 1}, {"channel": 2}, {"channel": 3}, {"channel": 4}, {"channel": 5}, {"channel": 6}]}'

# ---- channel 1 ----
[[point]]
key = "power_1"
label = "Puissance 1"
from = "e.payload.electricity.[channel=1].power"
kind = "numeric"
unit = "W"
scale = 0.001
round = 1

[[point]]
key = "current_1"
label = "Courant 1"
from = "e.payload.electricity.[channel=1].current"
kind = "numeric"
unit = "A"
scale = 0.001
round = 3

[[point]]
key = "voltage_1"
label = "Tension 1"
from = "e.payload.electricity.[channel=1].voltage"
kind = "numeric"
unit = "V"
scale = 0.001
round = 1

[[point]]
key = "power_factor_1"
label = "Facteur de puissance 1"
from = "e.payload.electricity.[channel=1].factor"
kind = "numeric"
semantic = "other"
round = 2

[[point]]
key = "energy_today_1"
label = "Énergie du jour 1"
from = "e.payload.electricity.[channel=1].today"
kind = "numeric"
unit = "Wh"

[[point]]
key = "energy_month_1"
label = "Énergie du mois 1"
from = "e.payload.electricity.[channel=1].mConsume"
kind = "numeric"
unit = "Wh"

