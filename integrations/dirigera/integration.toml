[integration]
id = "dirigera"
name = "IKEA Dirigera (hub, API locale)"
brands = ["IKEA"]
models = ["DIRIGERA"]
transport = "https"
driver = "dirigera"
crate = "moli-dirigera"

[discovery]
# The hub announces itself, but the instance gives its address (as for Hue):
# a reserved DHCP lease is enough.
mdns = ["_ihsp._tcp"]
ssdp = []
ports = [8443]

[needs]
# token and cert_sha256 are written by the driver itself at pairing (a human
# presses the action button under the hub): nothing to provide.
secrets = []
vars = []
options = ["host"]

[origin]
reused = "aucun code repris : API locale non officielle, lue dans lpgera/dirigera et Leggin/dirigera (MIT), appairage vérifié sur un hub"
author = "agent"

# Replayed by the crate's tests (crates/moli-dirigera/src/model.rs).
[[fixture]]
file = "fixtures/home.json"

[[fixture]]
file = "fixtures/events.json"
