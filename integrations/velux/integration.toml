[integration]
id = "velux"
name = "VELUX ACTIVE with NETATMO (KIX 300)"
# Roof windows, blinds and shutters on a KIX 300 gateway, and its sensors.
brands = ["VELUX", "Netatmo"]
models = ["KIX 300"]
# Internet: the cloud of the VELUX ACTIVE app (a Netatmo server), forms in, JSON out, over HTTPS.
transport = "https"
driver = "velux"
crate = "moli-velux"

[discovery]
mdns = []
ssdp = []
ports = []

[needs]
# The VELUX ACTIVE account, filed in the vault by the person.
secrets = ["email", "password"]
vars = []
options = ["host", "every"]

[origin]
reused = "aucun code repris : connexion et lectures du cloud VELUX ACTIVE (api/homesdata, api/homestatus) telles que les décrivent ha-velux-active (IngmarStein, Apache-2.0 ; Niek, MIT), vérifiées par une sonde contre une installation réelle"
author = "agent"

# Replayed by the crate's tests (crates/moli-velux/src/model.rs): a real
# KIX 300 home (gateway, 7 windows, 8 blinds, sensor, departure switch), ids made up.
[[fixture]]
file = "fixtures/kix300.json"
