[integration]
id = "tesla"
name = "Voiture Tesla (API officielle)"
# Official: Tesla's owner API, the same one the car's own app uses. Battery,
# range, charging, doors and sentry, plus the six orders the house gives. The
# account is connected once from the dashboard (owner-only PKCE sign-in, the
# pasted callback is state-bound and redacted from the journal); the refresh
# token it rotates is kept in the encrypted secret store. Sign-out erases the
# refresh token from the vault and restarts the waiting state.
brands = ["Tesla"]
models = ["Model S", "Model 3", "Model X", "Model Y"]
transport = "https"
driver = "tesla"
crate = "moli-tesla"

[discovery]
# A cloud account: nothing to find on the home network.
mdns = []
ssdp = []
ports = []

[needs]
# refresh_token est délivré par la connexion du tableau de bord, jamais saisi dans un fichier.
# client_id est obligatoire (l'application personnelle developer.tesla.com ; le client
# public partagé a été retiré par Tesla en 2026), client_secret seulement si Tesla en
# donne un à l'application.
secrets = ["refresh_token", "client_id", "client_secret"]
vars = []
options = []

[origin]
reused = ""
author = "agent"
