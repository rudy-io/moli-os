# Moli OS configuration. No secret here, ever: credentials are referenced by
# the name of the environment variable holding them (e.g. password_env).

[server]
listen = "0.0.0.0:8790"
# "/data" in the image (the volume); "data" for a run from the repository.
data_dir = "/data"
worker_threads = 2
# Names/IPs this instance is reached by, besides localhost (DNS-rebinding guard).
allowed_hosts = ["192.168.0.10", "moli.local"]
# The house's time zone (IANA), for everything that tells the time: when
# automations fire, where energy days are cut, the assistant's clock, the
# quiet hours. Absent: the system's, named at start; in a container it is
# usually UTC, so write it.
timezone = "Europe/Paris"

# Reached from the Internet through a Cloudflare tunnel behind Cloudflare
# Access: Moli checks Access's signed assertion itself and recognizes the
# person by e-mail. Without this section, nobody coming through Cloudflare
# is recognized (a stranger, never the household).
# A guest whose stay is over, or a person removed, is a stranger even if the
# Access rule still lets their e-mail in. known_only = true: once there are
# people, an e-mail none of them has is a stranger too.
# [server.access]
# team = "myteam"        # https://myteam.cloudflareaccess.com
# aud = "<application audience tag>"
# known_only = false

# Guard: where and when agents (MCP), scripts (API) and the CLI must ask a
# human (approval from the dashboard). The household in the dashboard is
# obeyed without a code (dashboard = "trusted", the default: the home network
# and people Access let in), except in protected rooms and on machines, where
# the PIN is needed (anyone on the network can claim to be the dashboard); the
# PIN also approves automations and releases what an agent asked for.
# dashboard = "pin": every command needs a PIN session; from agents, scripts,
# the CLI or the dashboard without a code, it waits for a human (approved
# automations still run).
# [guard]
# dashboard = "trusted"
# protected_rooms = ["Chambre", "Chambre des enfants"]
# protected_devices = ["z2m:0x00124b0000aa0013"]   # whatever their room
#
# [guard.quiet_hours]
# from = "21:00"
# to = "07:30"
# rooms = []            # empty = the whole home

# Energy: cumulative counters (Wh or kWh) become kWh and cost per hour,
# kept forever in data/energy.db. Roles: grid (billed: the reference),
# total (whole home, fine), circuit (part of the total).
# [energy]
# [energy.tariff]
# period = "z2m:linky/active_register_tier_delivered"
# prices = { "HP" = 0.17, "HC" = 0.14 }
# Or, instead of `period` (the two are mutually exclusive), a fixed weekly
# planning: the windows of each weekday must tile [00:00, 24:00) exactly,
# `to` may be "24:00", and `period` must name a key of `prices`.
# # [[energy.tariff.planning]]
# # days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
# # from = "00:00"
# # to = "01:00"
# # period = "HP"
# # [[energy.tariff.planning]]
# # days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
# # from = "01:00"
# # to = "24:00"
# # period = "HC"
# [[energy.meter]]
# id = "linky-hc"        # storage key: never rename
# name = "Heures creuses"
# point = "z2m:linky/current_tier1_summ_delivered"
# role = "grid"
# price = 0.14           # optional: without it, the house's price chosen on the Energy page
# reset = "never"        # an index; default "auto" handles daily counters

# Without a local reading of the meter, the `enedis` driver reports yesterday's
# consumption hour by hour:
# [[energy.meter]]
# id = "linky"
# name = "Linky"
# point = "enedis:linky/hours"
# role = "grid"
# history = true
# price = 0.17

# Light fixtures: bulbs and the relay that feeds them as one light
# (lumieres:<id>). Orders go to the bulbs; the relay only cuts when no bulb
# answers, and comes back on its own when the light is switched on.
# [[fixture]]
# id = "suspensions"     # never rename
# name = "Suspensions"
# room = "Salon"
# bulbs = ["hue:…", "hue:…"]
# power = "tuya:…/switch_1"

# House-held virtual values (HA input_* equivalents). `aggregate` computes a
# read-only statistic over existing Moli points; it is useful for a Jeedom
# “virtual sensor”, e.g. the average house temperature.
# [[driver]]
# id = "maison"
# kind = "helpers"
#
# [[driver.options.helper]]
# id = "mode_maison"
# name = "Mode Maison"
# kind = "select"
# options = ["Normal", "Absent", "Nuit", "Vacances"]
# initial = "Normal"
#
# [[driver.options.helper]]
# id = "temp_maison"
# name = "Température moyenne"
# kind = "aggregate"
# op = "avg"             # or "min" / "max"
# unit = "°C"
# semantic = "temperature"
# stale_s = 7200         # optional: drop source readings older than 2 h
# points = [
#   "z2m:0x00124b0000000001/temperature",
#   "zwave:0x00000001/temperature",
# ]

# Zigbee, through an existing Zigbee2MQTT bridge.
[[driver]]
id = "z2m"
kind = "z2m"

[driver.options]
host = "127.0.0.1"
port = 1883
base_topic = "zigbee2mqtt"
# username = "moli-os"
# password_env = "MOLI_Z2M_PASSWORD"

# Z-Wave, through an existing Z-Wave JS UI bridge (its MQTT gateway).
# [[driver]]
# id = "zwave"
# kind = "zwave"
#
# [driver.options]
# host = "127.0.0.1"
# port = 1883
# base_topic = "zwave"       # the gateway's MQTT topic prefix
# mqtt_name = "zwave-js-ui"  # the gateway's MQTT client name (its MQTT "Name" field; default "zwave-js-ui")
# username = "moli-os"
# password_env = "MOLI_ZWAVE_PASSWORD"

# Philips Hue bridge (CLIP v2). Needs MOLI_MASTER_KEY in the environment to
# keep the pairing key encrypted; press the link button when asked.
# [[driver]]
# id = "hue"
# kind = "hue"
#
# [driver.options]
# host = "192.168.0.x"

# Somfy TaHoma developer mode, local HTTPS. Store the token under somfy/token
# in the encrypted vault. Observe first; see integrations/overkiz/README.md.
# [[driver]]
# id = "somfy"
# kind = "overkiz"
#
# [driver.options]
# host = "gateway-example.local"
# read_only = true
# port = 8443
# poll_secs = 5

# Airzone Local API, one instance per controller. Omitted read_only defaults to
# false, retaining only historical writes. See integrations/airzone/README.md.
# [[driver]]
# id = "airzone"
# kind = "airzone"
#
# [driver.options]
# host = "controller.example"
# port = 3000
# poll_secs = 30
# read_only = true
# write = "extended"          # opt in to new commands; read_only still takes priority
# mac = "aa:bb:cc:dd:ee:ff"   # optional identity pin
# dhw_units = 0               # only if DHW omits its unit: 0 Celsius, 1 Fahrenheit
# For HTTPS: replace port with the controller's TLS port and explicitly pin:
# tls_fingerprint = "<64 hexadecimal SHA-256 characters>"

# IKEA, through a Dirigera hub (local API). Needs the master key: the driver
# keeps its token encrypted; press the action button under the hub when asked.
# [[driver]]
# id = "ikea"
# kind = "dirigera"
#
# [driver.options]
# host = "192.168.0.x"

# La voiture (son API officielle) : batterie, autonomie, recharge, puissance,
# portes, mode vigie et les six commandes de la tuile. Le compte se connecte
# une fois depuis le tableau de bord (Système, pilote tesla : l'adresse à
# ouvrir s'y affiche, la dernière adresse s'y colle) ; le jeton de
# rafraîchissement vit au coffre chiffré, jamais dans un fichier.
#
# Le client public partagé de Tesla n'existe plus (2026) : une application
# personnelle est requise. Crée-la sur developer.tesla.com (permissions
# openid, offline_access, user_data, vehicle_device_data, vehicle_cmds),
# enregistre-y une URI de redirection (par ex. https://example.com/moli-tesla —
# la page n'a pas besoin d'exister : c'est l'adresse qui porte le code), puis
# dépose ses identifiants au coffre : moli-os secrets set tesla client_id et
# moli-os secrets set tesla client_secret (valeurs par un tube).
# [[driver]]
# id = "tesla"
# kind = "tesla"
#
# [driver.options]
# api_host = "fleet-api.prd.eu.vn.cloud.tesla.com" # l'API (Europe) ; Amérique du Nord / Asie : fleet-api.prd.na.vn.cloud.tesla.com, Chine : api.tesla.cn
# auth_host = "auth.tesla.com"                     # la connexion et le point de jeton
# redirect_uri = "https://example.com/moli-tesla"  # l'URI enregistrée sur l'application (obligatoire, identique)
# partner_domain = "example.com"                   # domaine public des origines autorisées, hébergeant la clé publique Tesla (défaut : l'hôte de redirect_uri)
# poll_charging_s = 60                             # pendant la recharge ou branchée
# poll_idle_s = 180                                # éveillée et au repos
# poll_asleep_s = 600                              # endormie
#
# Énergie : la recharge de la voiture compte dans la conso de la maison
# (compteur « appliance » sur la puissance de charge, intégrée dans le temps).
# Remplacer <vehicle id> par l'id du véhicule (visible dans /api/devices,
# instance « tesla »). Sans compteur grid/total/circuit déclaré, ce sont les
# compteurs appliance (ces prises, la voiture) qui forment le total maison.
# [[energy.meter]]
# id = "tesla"                     # clé de stockage : ne jamais renommer
# name = "Voiture"
# point = "tesla:<vehicle id>/charge_power"
# role = "appliance"
# integrate = true
# Ring doorbells and cameras (Amazon Vision Partner API). The partner keys and
# the HMAC key live in the vault: `moli-os secrets set ring client_id`,
# `client_secret` and `hmac_key` (from developer.amazon.com/ring/console/apps).
# The refresh token is filed by Moli itself when you confirm the link in the
# Ring app. A doorbell needs the Ring base plan.
# [[driver]]
# id = "ring"
# kind = "ring"

# Moli, l'assistant (API compatible OpenAI). Clé : <source> | moli-os secrets set assistant api_key
# [assistant]
# model = "gpt-4.1-mini"
# transcribe_model = "gpt-4o-mini-transcribe"   # écoute cloud ; "" = Whisper local seulement
# speech_model = "gpt-4o-mini-tts"              # voix cloud ; "" = Piper local seulement
# speech_voice = "coral"            # une voix OpenAI ; essai : POST /api/assistant/speak {"text","voice"}
# speech_style = "Ton enjoué et souriant, plein d'énergie, comme un ami content de rendre service. Intonation vivante, débit vif, français naturel de France."
# local_speech = "127.0.0.1:10200"              # Piper (Wyoming), repli de la voix ; "" = aucun
# local_voice = "fr_FR-siwis-medium"
# local_listen = "127.0.0.1:10300"              # Whisper (Wyoming), repli de l'écoute ; "" = aucun

# Plusieurs fournisseurs, chacun avec le niveau de données le plus sensible qu'il peut recevoir
# (1 = un modèle chez soi, 2 = un cloud qui ne voit que la structure pseudonymisée, 3 = un cloud libre).
# Sans `tier`, un fournisseur ne reçoit rien. Sans `[[assistant.provider]]`, le réglage ci-dessus s'applique.
# Avec des fournisseurs, `base_url`, `model` et `builder_model` de `[assistant]` sont remplacés par ceux du
# fournisseur de la route `chat`, et la recherche web est coupée. Clé du fournisseur :
# `moli-os secrets set assistant api_key.<id>`.
# [[assistant.provider]]
# id = "local"
# base_url = "http://127.0.0.1:11434/v1"   # Ollama
# model = "un-modele-local"
# tier = 1
# contract = "moli-v4"   # optionnel : le modèle maison, entraîné sur ce contrat (docs/components/moli.md).
#                        # Prompt statique (appareils numérotés), 25 outils figés ; Moli traduit les numéros,
#                        # lit les valeurs et formule la réponse. Un autre contrat est refusé.
#
# [assistant.routes]
# chat = "local"        # la conversation (obligatoire avec des fournisseurs)
# # voice, builder : le même fournisseur que chat pour l'instant
# # audit = "…"         # tâches lourdes sans donnée de la maison (utilisé plus tard)

# Compteur Linky, par l'interface USB-TIC (lecture seule). Le pilote publie
# les points du compteur (puissance, intensités, compteurs Wh, période) sur
# l'appareil « teleinfo:linky ». Le module énergie les consomme ensuite.
# [[driver]]
# id = "teleinfo"
# kind = "teleinfo"
#
# [driver.options]
# port = "/dev/ttyUSB0"          # le port série de l'interface USB-TIC
# baud = 9600                    # 9600 = mode standard du Linky ; 1200 = mode historique
# id = "linky"                   # l'appareil sera « teleinfo:linky »
# name = "Linky"
# offline_after = 90             # secondes sans trame avant « hors ligne »
#
# Énergie : la puissance instantanée (VA) pour le jauge, les compteurs (Wh)
# pour les index. Remplacer les points selon le tarif (BASE : hchc/hchp,
# HEURES PLEINES/CREUSES : hchc1..3/hchp1..3, TEMPO : east + easf01..10).
# [energy.live]
# power = "teleinfo:linky/papp"  # TEMPO : "teleinfo:linky/sinsts"
# max = 9000                     # puissance souscrite, dans l'unité du point (VA)
#
# [[energy.meter]]
# id = "linky"                   # clé de stockage : ne jamais renommer
# name = "Linky"
# point = "teleinfo:linky/hchc"  # l'index cumulé (Wh) du tarif
# role = "grid"
# reset = "never"                # un index Linky ne redescend jamais
