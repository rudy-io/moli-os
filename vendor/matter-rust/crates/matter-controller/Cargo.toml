[package]
name = "matter-controller"
version = "0.18.3"
description = "High-level Matter controller API: commission, read, write, invoke, subscribe."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["matter", "controller", "smart-home", "iot"]
categories = ["api-bindings", "network-programming"]
readme = "README.md"

[lints]
workspace = true

[features]
default = []

# Upstream feature names are kept so the crate's `#[cfg(feature = ...)]`
# structure is unchanged, but the crates they used to pull in (matter-ota,
# matter-bdx, matter-ble) are not vendored: Moli depends on this crate with
# `default-features = false`, and enabling either feature here is unsupported.
ota = []
ble = []



# UNSTABLE, not covered by semver. Exposes the low-level provider-server
# building blocks (`ProviderServer`, `build_operational_service`) and
# `MatterController::serve_provider_once` — a generic CASE/IM responder for
# power users building a custom server. The supported, stable OTA path is
# `MatterController::serve_ota`, which needs none of this. May change or be
# removed in any release.
unstable-provider = []

[dependencies]
matter-codec = { path = "../matter-codec", version = "0.3.0" }
matter-cert = { path = "../matter-cert", version = "0.3.0" }
matter-crypto = { path = "../matter-crypto", version = "0.5.0" }
matter-transport = { path = "../matter-transport", version = "0.7.4" }
matter-commissioning = { path = "../matter-commissioning", version = "0.10.1", features = ["driver"] }
matter-interaction = { path = "../matter-interaction", version = "0.4.3" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
matter-clusters = { path = "../matter-clusters", version = "0.6.0" }
thiserror = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# SHA-256 only, for the commissioner-identity fingerprint stamped on each
# stored CASE resumption record. Already in the tree via matter-crypto /
# matter-cert; declared directly here so the use is visible.
ring = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Test-only: enables `matter_commissioning::test_support`'s canned
# `CommissionedFabric` constructor so actor.rs's unit tests can exercise a
# successful-commission completion without a full PASE/CASE handshake.
# Mirrors matter-commissioning's own dev-dependency on matter-cert's
# `test-support`. Cargo unifies this into the lib build only under
# `cargo test` (dev-dependencies never apply to a plain `cargo build`).
matter-commissioning = { path = "../matter-commissioning", version = "0.10.1", features = ["driver", "test-support"] }
