# Dependencies against the RustSec advisory database. Separate from check.yml:
# a new advisory can appear without any change here, so it also runs every week.
# Ignored advisories, each with its reason: .cargo/audit.toml.
name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check scoped TLS advisory exceptions
        run: |
          python3 scripts/test-audit-guard.py
          python3 scripts/audit-guard.py
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-audit
      - run: cargo audit
